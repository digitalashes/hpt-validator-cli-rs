name: Release

# Pushing a tag such as v0.1.0 creates its release and attaches a binary per platform.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes ""

  binary:
    needs: release
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: hpt-validator-cli-rs
    steps:
      - uses: actions/checkout@v7
        with:
          path: hpt-validator-cli-rs
      # ponytail: builds against the validator's main branch, as CI tests it, so a binary
      # can hold validator changes not yet on crates.io; check out its tag if that matters.
      - uses: actions/checkout@v7
        with:
          repository: digitalashes/hpt-validator-rs
          path: hpt-validator-rs
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          name="hpt-validator-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp README.md AGENTS.md LICENSE target/${{ matrix.target }}/release/hpt-validator* "$name/"
          rm -f "$name"/*.d "$name"/*.pdb
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$name.zip" "$name" >/dev/null; file="$name.zip"
          else tar czf "$name.tar.gz" "$name"; file="$name.tar.gz"; fi
          gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
