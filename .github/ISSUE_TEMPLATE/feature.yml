name: Feature
description: Something the CLI should do that it does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Without `--extended` the CLI prints exactly what upstream's CLI prints, so a change
        to the rules or messages belongs upstream. New options and `--extended` output are
        open to proposals.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stands in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
