[package]
name = "hpt-validator-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Command-line validator for CMS Hospital Price Transparency machine-readable files, a port of @cmsgov/hpt-validator-cli"
license = "CC0-1.0"
repository = "https://github.com/digitalashes/hpt-validator-cli-rs"
keywords = ["cms", "price-transparency", "validator", "healthcare", "cli"]
categories = ["command-line-utilities"]
include = ["/src", "/README.md", "/AGENTS.md", "/LICENSE"]

[[bin]]
name = "hpt-validator"
path = "src/main.rs"

[dependencies]
hpt-validator = { path = "../hpt-validator-rs", version = "0.1.0" }
flate2 = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
