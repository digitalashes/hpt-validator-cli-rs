[package]
name = "hpt-validator-cli"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Command-line validator for CMS Hospital Price Transparency machine-readable files, a port of @cmsgov/hpt-validator-cli"
license = "CC0-1.0"
repository = "https://github.com/digitalashes/hpt-validator-cli-rs"
keywords = ["cms", "price-transparency", "healthcare", "hospital", "validator"]
categories = ["command-line-utilities"]
include = ["/src", "/README.md", "/AGENTS.md", "/LICENSE"]

[[bin]]
name = "hpt-validator"
path = "src/main.rs"

[dependencies]
hpt-validator = { path = "../hpt-validator-rs", version = "0.1.0" }
flate2 = "1"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
